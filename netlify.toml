[build]
  command = "npm run build"
  publish = "dist"

# supabase-js needs Node 22+ (native WebSocket); Vite 8 needs 20.19+.
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Wallet signing files travel encrypted (certs.enc, key: CERTS_KEY env);
  # pass images and fonts are read from disk at runtime.
  included_files = ["netlify/functions/certs.enc", "netlify/functions/wallet-assets/**"]

# Safety net: retry ticket e-mails / invoices and lost Barion callbacks.
[functions."retry-fulfillment"]
  schedule = "*/5 * * * *"

# Local: `npx netlify dev` → site + functions on http://localhost:8888
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# Security headers. frame-ancestors/X-Frame-Options: the site (checkout,
# scanner, admin) can't be framed by another site (clickjacking). Camera only
# for our own pages (the door scanner).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"

# Admin and scanner: never cached, never indexed.
[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/scan"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# SPA: every route (/jegyek, /success, /barok/bor …) serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
