<!doctype html>
<!--
  Social share image (Facebook / Messenger / iMessage …), 1200 × 630.
  Rendered to public/og/og-boarding-pass.jpg by scripts/og/render.cjs.
  Boarding pass in the site's "one flight" language (same route and flight
  number as the Wallet pass). Codes are decorative, not real IATA codes.
-->
<html lang="hu">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Cinzel; src: url(../../netlify/functions/wallet-assets/fonts/Cinzel_700Bold.ttf); font-weight: 700; }
  @font-face { font-family: Inter; src: url(../../netlify/functions/wallet-assets/fonts/Inter_400Regular.ttf); font-weight: 400; }
  @font-face { font-family: Inter; src: url(../../netlify/functions/wallet-assets/fonts/Inter_600SemiBold.ttf); font-weight: 600; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, sans-serif; color: #f5f5f7;
    background: #05030a url(../../public/hero.jpg) center 35% / cover;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  body::before { /* darken the hall photo, gold glow behind the pass */
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 55% at 50% 55%, rgba(212,175,55,.16), transparent 70%),
      linear-gradient(180deg, rgba(5,3,10,.82), rgba(5,3,10,.92));
  }
  .pass {
    position: relative; display: flex; width: 1040px; height: 470px;
    border-radius: 6px; overflow: hidden;
    background: linear-gradient(160deg, #120d1b 0%, #08060e 70%);
    border: 2px solid rgba(212,175,55,.75);
    box-shadow: 0 40px 90px -30px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.04) inset;
  }
  .main { flex: 1; padding: 34px 40px 30px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-family: Cinzel; font-weight: 700; font-size: 22px; letter-spacing: .12em; }
  .brand small { font-family: Inter; font-size: 15px; font-weight: 600; letter-spacing: .3em; color: #f0c94a; margin-left: 14px; vertical-align: 3px; }
  .mono { width: 46px; height: 46px; }
  .route { display: flex; align-items: center; gap: 26px; margin-top: 34px; }
  .iata { font-weight: 600; font-size: 96px; color: #ffffff; line-height: 1; letter-spacing: -.02em; }
  .city { font-size: 16px; font-weight: 600; letter-spacing: .26em; color: #d6d1e2; margin-top: 8px; }
  .path { flex: 1; position: relative; height: 2px; background: repeating-linear-gradient(90deg, #f0c94a 0 12px, transparent 12px 22px); height: 3px; }
  .plane { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: #0f0b17; border-radius: 50%; display: grid; place-items: center; }
  .fields { display: flex; gap: 38px; margin-top: auto; }
  .f { white-space: nowrap; }
  .f .k { font-size: 14px; font-weight: 600; letter-spacing: .24em; color: #c4bfd0; }
  .f .v { font-size: 28px; font-weight: 600; margin-top: 6px; color: #ffffff; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .f .v.gold { color: #f5cf4f; }
  .slogan { margin-top: 26px; font-family: Cinzel; font-weight: 700; font-size: 38px; color: #f8dc7c; letter-spacing: .01em; }
  /* perforation between the main part and the stub */
  .perf { position: relative; width: 0; border-left: 2px dashed rgba(255,255,255,.32); margin: 22px 0; }
  .perf::before, .perf::after { content: ''; position: absolute; left: -16px; width: 30px; height: 30px; border-radius: 50%; background: #070510; border: 2px solid rgba(212,175,55,.75); }
  .perf::before { top: -38px; } .perf::after { bottom: -38px; }
  .stub { width: 250px; padding: 34px 30px 28px; display: flex; flex-direction: column; background: linear-gradient(180deg, rgba(212,175,55,.10), rgba(212,175,55,.02)); }
  .stub .f + .f { margin-top: 22px; }
  .stub .v { font-size: 30px; }
  .bars { margin-top: auto; height: 74px; display: flex; gap: 2px; align-items: stretch; }
  .bars i { display: block; background: #ffffff; }
</style>
</head>
<body>
  <div class="pass">
    <div class="main">
      <div class="top">
        <div class="brand">ONE NIGHT AT ÍROTTKŐ<small>BOARDING PASS</small></div>
        <!-- the site's gold "Í" monogram -->
        <svg class="mono" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e7a9"/><stop offset="1" stop-color="#aa820a"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#d4af37" stroke-opacity=".6" stroke-width="2"/><path fill="url(#g)" d="M22 21h20v3.5h-5.5v22h5.5V50H22v-3.5h5.5v-22H22z"/><path fill="url(#g)" d="M30.5 17.5 36 9.5h5.5l-7.5 8z"/></svg>
      </div>

      <div class="route">
        <div><div class="iata">KSZ</div><div class="city">KŐSZEG</div></div>
        <div class="path"><div class="plane">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#d4af37"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" transform="rotate(90 12 12)"/></svg>
        </div></div>
        <div style="text-align:right"><div class="iata">ÍRK</div><div class="city">HOTEL ÍROTTKŐ</div></div>
      </div>

      <div class="fields">
        <div class="f"><div class="k">JÁRAT</div><div class="v">ÍR 0115</div></div>
        <div class="f"><div class="k">DÁTUM</div><div class="v">2027.01.15.</div></div>
        <div class="f"><div class="k">GATE OPEN</div><div class="v gold">19:00</div></div>
        <div class="f"><div class="k">LANDING</div><div class="v">HAJNALBAN</div></div>
      </div>
      <div class="slogan">Csak egy járat indul!</div>
    </div>

    <div class="perf"></div>

    <div class="stub">
      <div class="f"><div class="k">UTAS</div><div class="v">TE</div></div>
      <div class="f"><div class="k">HEADLINER</div><div class="v gold" style="font-size:22px;line-height:1.2">DJ Bárány<br>Attila</div></div>
      <div class="bars" id="bars"></div>
    </div>
  </div>
<script>
  // Decorative barcode (deterministic, so re-renders look the same).
  const bars = document.getElementById('bars');
  let seed = 115;
  const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  for (let w = 0; w < 186; ) {
    const bw = 1 + Math.floor(rnd() * 4), gap = 1 + Math.floor(rnd() * 3);
    const el = document.createElement('i'); el.style.width = bw + 'px'; el.style.marginRight = gap + 'px';
    bars.appendChild(el); w += bw + gap + 2;
  }
</script>
</body>
</html>
