<!doctype html>
<!--
  Social share image (Facebook / Messenger / iMessage …), 1200 × 630 (rendered at 2×).
  Rendered to public/og/og-boarding-pass.jpg by scripts/og/render.cjs.
  Boarding pass in the site's "one flight" language; the headliner is the hero
  of the image (he is why people buy). Codes are decorative, not IATA codes.
-->
<html lang="hu">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Cinzel; src: url(../../netlify/functions/wallet-assets/fonts/Cinzel_700Bold.ttf); font-weight: 700; }
  @font-face { font-family: Inter; src: url(../../netlify/functions/wallet-assets/fonts/Inter_400Regular.ttf); font-weight: 400; }
  @font-face { font-family: Inter; src: url(../../netlify/functions/wallet-assets/fonts/Inter_600SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: Inter; src: url(fonts/Inter_800ExtraBold.ttf); font-weight: 800; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, sans-serif; color: #fff;
    background: #05030a url(../../public/hero.jpg) center 35% / cover;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  body::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 55% 60% at 40% 55%, rgba(212,175,55,.18), transparent 70%),
      linear-gradient(180deg, rgba(5,3,10,.82), rgba(5,3,10,.93));
  }
  .pass {
    position: relative; display: flex; width: 1110px; height: 540px; border-radius: 6px; overflow: hidden;
    background: linear-gradient(160deg, #120d1b 0%, #08060e 70%);
    border: 2px solid rgba(212,175,55,.75);
    box-shadow: 0 40px 90px -30px rgba(0,0,0,.95);
  }
  .main { flex: 1; min-width: 0; padding: 34px 44px 32px; display: flex; flex-direction: column; }
  .kick { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; letter-spacing: .28em; color: #f0c94a; }
  .kick .sep { color: #6f6a7c; }
  .kick .r { color: #d6d1e2; letter-spacing: .18em; }
  .brand { margin-top: 14px; font-family: Cinzel; font-weight: 700; font-size: 53px; line-height: 1; letter-spacing: .03em; white-space: nowrap; color: #fff; }
  .brand span { color: #f5cf4f; }
  .brand small { font-family: Inter; font-size: 15px; font-weight: 600; letter-spacing: .3em; color: #f0c94a; margin-left: 14px; vertical-align: 3px; }
  .mono { width: 44px; height: 44px; }

  .route { display: flex; align-items: center; gap: 16px; margin-top: 18px; font-weight: 600; font-size: 22px; letter-spacing: .08em; color: #e4dfee; }
  .route .dash { width: 90px; height: 3px; background: repeating-linear-gradient(90deg, #f0c94a 0 9px, transparent 9px 16px); }
  .route .city { font-size: 13px; letter-spacing: .24em; color: #b9b4c6; margin-left: 2px; }

  .label { margin-top: 38px; font-size: 16px; font-weight: 600; letter-spacing: .34em; color: #f0c94a; }
  .headliner {
    margin-top: 6px; font-weight: 800; font-size: 112px; line-height: .95; letter-spacing: -.035em;
    background: linear-gradient(180deg, #fff3c4 0%, #f5cf4f 45%, #c99a1c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 24px rgba(212,175,55,.25));
  }
  .bottom { margin-top: auto; }
  .slogan { font-family: Cinzel; font-weight: 700; font-size: 24px; color: #ffffff; letter-spacing: .01em; }
  .others { margin-top: 6px; font-size: 16px; font-weight: 600; color: #cfcadb; letter-spacing: .02em; }
  .others b { color: #fff; font-weight: 600; }

  .perf { position: relative; width: 0; border-left: 2px dashed rgba(255,255,255,.32); margin: 22px 0; }
  .perf::before, .perf::after { content: ''; position: absolute; left: -16px; width: 30px; height: 30px; border-radius: 50%; background: #070510; border: 2px solid rgba(212,175,55,.75); }
  .perf::before { top: -38px; } .perf::after { bottom: -38px; }
  .stub { width: 260px; flex-shrink: 0; padding: 30px 30px 30px; display: flex; flex-direction: column; background: linear-gradient(180deg, rgba(212,175,55,.12), rgba(212,175,55,.02)); }
  .f { white-space: nowrap; }
  .f + .f { margin-top: 20px; }
  .f .k { font-size: 14px; font-weight: 600; letter-spacing: .24em; color: #c4bfd0; }
  .f .v { font-size: 30px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .f .v.gold { color: #f5cf4f; }
  .bars { margin-top: auto; height: 70px; display: flex; align-items: stretch; }
  .bars i { display: block; background: #fff; }
</style>
</head>
<body>
  <div class="pass">
    <div class="main">
      <div class="kick">
        <span>BOARDING PASS</span><span class="sep">·</span>
        <span class="r">KSZ</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#f0c94a"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" transform="rotate(90 12 12)"/></svg>
        <span class="r">ÍRK</span>
      </div>
      <div class="brand">ONE NIGHT <span>AT ÍROTTKŐ</span></div>

      <div class="label">HEADLINER</div>
      <div class="headliner">DJ BÁRÁNY<br>ATTILA</div>

      <div class="bottom">
        <div class="slogan">Csak egy járat indul!</div>
        <div class="others">Fedélzeten még: <b>SAFFRON</b> · <b>fromBOB</b> · <b>TISZTAFAXXA</b></div>
      </div>
    </div>

    <div class="perf"></div>

    <div class="stub">
      <svg style="width:44px;height:44px;margin-bottom:22px" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e7a9"/><stop offset="1" stop-color="#aa820a"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#d4af37" stroke-opacity=".7" stroke-width="2"/><path fill="url(#g)" d="M22 21h20v3.5h-5.5v22h5.5V50H22v-3.5h5.5v-22H22z"/><path fill="url(#g)" d="M30.5 17.5 36 9.5h5.5l-7.5 8z"/></svg>
      <div class="f"><div class="k">DÁTUM</div><div class="v">2027.01.15.</div></div>
      <div class="f"><div class="k">GATE OPEN</div><div class="v gold">19:00</div></div>
      <div class="f"><div class="k">JÁRAT</div><div class="v">ÍR 0115</div></div>
      <div class="bars" id="bars"></div>
    </div>
  </div>
<script>
  const bars = document.getElementById('bars');
  let seed = 115;
  const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  for (let w = 0; w < 196; ) {
    const bw = 1 + Math.floor(rnd() * 4), gap = 1 + Math.floor(rnd() * 3);
    const el = document.createElement('i'); el.style.width = bw + 'px'; el.style.marginRight = gap + 'px';
    bars.appendChild(el); w += bw + gap;
  }
</script>
</body>
</html>
