<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg" cx="70%" cy="40%" r="80%">
      <stop offset="0" stop-color="#2e2410"/>
      <stop offset="0.6" stop-color="#110c07"/>
      <stop offset="1" stop-color="#05030a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e7a9"/>
      <stop offset="1" stop-color="#b8901f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#d4af37" stroke-opacity="0.12" stroke-width="2">
    <line x1="560" y1="250" x2="560" y2="-40"/><line x1="560" y1="250" x2="700" y2="-30"/><line x1="560" y1="250" x2="420" y2="-30"/>
    <line x1="560" y1="250" x2="820" y2="60"/><line x1="560" y1="250" x2="300" y2="60"/><line x1="560" y1="250" x2="840" y2="200"/>
  </g>
  <!-- cloche -->
  <g transform="translate(560 270)">
    <path d="M-150 0 A150 150 0 0 1 150 0 Z" fill="#d4af37" fill-opacity="0.08" stroke="url(#gold)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-110 -40 A120 120 0 0 1 -40 -110" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-162" r="14" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <rect x="-185" y="0" width="370" height="14" rx="3" fill="url(#gold)"/>
  </g>
  <!-- small disco ball -->
  <g transform="translate(700 95)">
    <line x1="0" y1="-95" x2="0" y2="-34" stroke="#d4af37" stroke-opacity="0.6" stroke-width="2"/>
    <circle r="34" fill="#1a1626" stroke="url(#gold)" stroke-width="3"/>
    <g stroke="#d4af37" stroke-opacity="0.45" stroke-width="1.5" fill="none">
      <ellipse rx="34" ry="12"/><ellipse rx="34" ry="24"/><ellipse rx="12" ry="34"/><ellipse rx="24" ry="34"/>
    </g>
    <circle cx="-10" cy="-12" r="5" fill="#fff" fill-opacity="0.7"/>
  </g>
</svg>
